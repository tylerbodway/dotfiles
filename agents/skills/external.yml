# Third-party agent skills, installed by ./install via `gh skill`
# (see dotbot-plugins/skills.py). Each entry installs into `dir` as a plain
# directory the agents already scan; re-runs overwrite in place with the
# latest ref, so `./install --only=skills` also refreshes everything.
#
# - `repo` is OWNER/REPO (private repos use your gh auth).
# - `skills` names specific skills to install; omit to install every skill
#   in the repo.
# - `dir` overrides the install target (default ~/.agents/skills), e.g.
#   scoping company skills to ~/Code.
# - `pin` locks the install to a tag or commit SHA.
#
# Discover more with `gh skill search <query>`.

- repo: planningcenter/pco-box
  dir: ~/Code/.agents/skills
- repo: github/gh-stack
- repo: nikships/claude-artifact-cli
