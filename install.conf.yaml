- defaults:
    link:
      create: true
      relink: true
      force: true

- clean:
    ~/:
      force: true
    ~/.config:
      recursive: true

- link:
    ~/.config/bat/themes/vague.tmTheme: bat/vague.tmTheme
    ~/.config/bat/config: bat/config
    ~/.config/direnv/direnv.toml: direnv/direnv.toml
    ~/.config/ghostty:
      path: ghostty/**
      glob: true
    ~/.config/git/:
      path: git/**
      glob: true
    ~/.config/herdr/config.toml: herdr/config.toml
    ~/.config/herdr-automatic-rename/config.sh: herdr/plugins/automatic-rename/config.sh
    ~/.config/lazygit/config.yml: lazygit/config.yml
    ~/.config/nvim/:
      path: nvim/**
      glob: true
    ~/.config/opencode/:
      path: opencode/**
      glob: true
      exclude: [opencode/opencode.company.jsonc]
    ~/.agents/skills/:
      path: agents/skills/**
      glob: true
      exclude: [agents/skills/company, agents/skills/external.yml]
    ~/.config/posting/config.yaml: posting/config.yaml
    ~/.local/share/posting/themes/vague.yaml: posting/themes/vague.yaml
    ~/.config/process-compose/:
      path: process-compose/**
      glob: true
    ~/.config/zellij/:
      path: zellij/**
      glob: true
    ~/.config/zsh/:
      path: zsh/**
      glob: true
      prefix: .
    ~/.local/bin:
      path: bin/**
      glob: true
    ~/.editorconfig: editorconfig
    ~/.hushlogin: hushlogin
    ~/.ssh/config: ssh/config
    ~/.zshenv: zsh/zshenv

- brewfile:
    - Brewfile

- npm:
    - package.json

- gem:
    - Gemfile

- herdr:
    - herdr/plugins.yml

- skills:
    - agents/skills/external.yml

- shell:
    - command: chmod +x bin/*
      description: Making bin/ scripts executable
      quiet: true
    - command: bat cache --build
      description: Building bat cache for custom theme
      quiet: true
    - command: >-
        curl -fsSL https://plannotator.ai/install.sh | bash
      description: Installing plannotator for AI review/feedback
      quiet: true
    - command: >-
        source="$DOT/opencode/opencode.company.jsonc";
        for dir in ~/Code/ ~/Code/*/; do
          mkdir -p "$dir.opencode" && ln -sf "$source" "$dir.opencode/opencode.jsonc";
        done
      description: Symlinking company opencode config into projects
      quiet: true
